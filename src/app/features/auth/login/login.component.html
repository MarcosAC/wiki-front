<div class="login-container">
  <mat-card class="login-card mat-elevation-z4">
    <mat-card-header>
      <mat-card-title>Acesso à Wiki</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

        <mat-form-field appearance="outline">
          <mat-label>Usuário</mat-label>
          <input matInput formControlName="username" placeholder="Digite seu usuário">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Digite sua senha">
        </mat-form-field>

        @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">
          Entrar
        </button>

        <button mat-button color="primary" routerLink="/register" type="button">
          Criar uma nova conta
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
